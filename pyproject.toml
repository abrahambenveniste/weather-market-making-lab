[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-market-making-lab"
version = "0.1.0"
description = "Research and paper-trading tools for weather event market making"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
]

[project.scripts]
weather-mm = "weather_mm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_mm"]
